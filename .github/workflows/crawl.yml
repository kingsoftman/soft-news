name: 每日爬虫
on:
  schedule:
    # UTC 0点 = 北京时间 08:00，按需修改cron
    - cron: '0 0 * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  crawl:
    runs-on: ubuntu-latest
    env:
      PETNEWS_APIKEY: ${{ secrets.PETNEWS_APIKEY }}
    steps:
      - name: 检出仓库
        uses: actions/checkout@v4

      - name: 安装依赖
        run: pip install requests

      - name: 执行爬虫脚本
        run: python crawl.py

      - name: 提交更新
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "actions@users.noreply.github.com"
          git add articles.json
          git diff --cached --quiet || (git commit -m "更新宠物新闻 $(date -u +%Y-%m-%d)" && git push)
