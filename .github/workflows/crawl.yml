name: 自动抓取资讯
on:
  workflow_dispatch:
  schedule:
    - cron: '0 8 * * *'

permissions:
  contents: write

jobs:
  crawl_job:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: 拉取仓库代码
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: 设置Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: 安装依赖
        run: |
          pip install playwright

      - name: 安装Chromium
        run: |
          playwright install chromium

      - name: 执行爬虫脚本
        run: python crawl.py

      - name: 提交更新
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git checkout main
          # 先判断文件有没有改动
          CHANGED=$(git diff --quiet articles.json; echo $?)
          if [ $CHANGED -eq 0 ]; then
            echo "✅ 无更新，直接退出"
            exit 0
          fi
          git pull origin main
          git add articles.json
          git commit -m "🤖 自动更新 articles.json"
          git push origin main
