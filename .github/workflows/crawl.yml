name: 定时爬取iplaysoft
concurrency:
  group: crawl-job
  cancel-in-progress: true

on:
  workflow_dispatch:
  schedule:
    - cron: '0 0 * * *' # UTC 0点 = 北京时间8点

jobs:
  crawl:
    runs-on: ubuntu-latest
    timeout-minutes: 3 # 单个任务最多跑3分钟，卡死自动终止
    steps:
      - name: 检出代码
        uses: actions/checkout@v4
        with:
          persist-credentials: true

      - name: 安装依赖
        run: pip install requests beautifulsoup4

      - name: 执行爬虫脚本
        run: python crawl.py

      - name: 提交更新文件
        run: |
          git config --global user.name "kingsoftman"
          git config --global user.email "kingsoftman@users.noreply.github.com"
          git add articles.json
          git diff --quiet && git diff --staged --quiet || (git commit -m "自动更新刷机资讯" && git push)
