name: 自动抓取资讯
on:
  workflow_dispatch:
  schedule:
    - cron: '0 8 * * *'

permissions:
  contents: write

jobs:
  crawl_job:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: 拉取仓库代码
        uses: actions/checkout@v4

      - name: 设置Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: 安装依赖
        run: |
          pip install playwright

      - name: 安装Chromium
        run: |
          playwright install chromium

      - name: 执行爬虫脚本
        run: python crawl.py

      - name: 自动提交
        uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: "自动更新资讯"
          file_pattern: articles.json
