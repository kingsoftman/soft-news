name: 定时爬取iplaysoft
on:
  push:
    branches: [ main ]
  schedule:
    - cron: '0 0,6,12 * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  crawl:
    runs-on: ubuntu-latest
    steps:
      - name: 拉取代码
        uses: actions/checkout@v4

      - name: 安装Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: 安装依赖
        run: |
          pip install requests beautifulsoup4 lxml

      - name: 执行爬虫
        run: python crawl.py

      - name: 提交更新
        run: |
          git config --global user.name "github-actions"
          git config --global user.email "actions@github.com"
          git add articles.json
          git commit -m "auto update articles" || echo "No new content, skip commit"
          git push
