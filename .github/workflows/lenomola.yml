name: 定时爬取 lenomola 固件镜像
concurrency:
  group: crawl-job
  cancel-in-progress: true

on:
  workflow_dispatch:
  schedule:
    - cron: '0 0 * * *'  # UTC 0点 = 北京时间早上8点

jobs:
  crawl:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - name: 检出代码
        uses: actions/checkout@v4
        with:
          persist-credentials: true

      - name: 安装python依赖
        run: pip install playwright

      - name: 安装chromium浏览器
        run: playwright install chromium

      - name: 执行爬虫脚本
        run: python crawl_lenomola.py

      - name: 提交更新文件
        run: |
          git config --global user.name "kingsoftman"
          git config --global user.email "kingsoftman@users.noreply.github.com"
          git add lenomola_meta.json
          git diff --quiet && git diff --staged --quiet || (git commit -m "自动更新 lenomola 固件目录元数据" && git push)
