// 渲染列表
function renderList() {
  const list = document.getElementById('articleList');
  list.innerHTML = articles.map(a => `
    <div class="article-card" onclick="openDetail(${a.id})">
      <img src="${a.image}" alt="${a.title}">
      <div class="article-card-body">
        <span class="category">${a.category}</span>
        <h2>${a.title}</h2>
        <p class="excerpt">${a.excerpt}</p>
        <div class="meta">${a.date}</div>
      </div>
    </div>
  `).join('');
}

// 打开详情
function openDetail(id) {
  const a = articles.find(x => x.id === id);
  if (!a) return;
  document.getElementById('detailHero').src = a.image;
  document.getElementById('detailTitle').textContent = a.title;
  document.getElementById('detailMeta').textContent = `${a.category} · ${a.date}`;
  document.getElementById('detailBody').innerHTML = a.content;
  document.getElementById('listPage').classList.add('hidden');
  document.getElementById('detailPage').classList.add('active');
  window.scrollTo(0, 0);
}

// 返回
function goBack() {
  document.getElementById('detailPage').classList.remove('active');
  document.getElementById('listPage').classList.remove('hidden');
  window.scrollTo(0, 0);
}

renderList();
</script>
